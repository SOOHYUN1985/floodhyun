<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참가상 - 홍지안</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 210mm;
    height: 297mm;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
    font-family: 'Noto Serif KR', serif;
  }

  .certificate {
    width: 210mm;
    height: 297mm;
    background: linear-gradient(160deg, #fffdf5 0%, #fff8e7 50%, #fffdf5 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 18mm 15mm;
  }

  /* 외곽 장식 테두리 */
  .border-outer {
    position: absolute;
    inset: 8mm;
    border: 3px solid #c8900a;
    border-radius: 4px;
    pointer-events: none;
  }
  .border-inner {
    position: absolute;
    inset: 11mm;
    border: 1.5px solid #e8b84b;
    border-radius: 2px;
    pointer-events: none;
  }

  /* 코너 장식 */
  .corner {
    position: absolute;
    width: 28px;
    height: 28px;
    border-color: #c8900a;
    border-style: solid;
  }
  .corner.tl { top: 14mm; left: 14mm; border-width: 3px 0 0 3px; }
  .corner.tr { top: 14mm; right: 14mm; border-width: 3px 3px 0 0; }
  .corner.bl { bottom: 14mm; left: 14mm; border-width: 0 0 3px 3px; }
  .corner.br { bottom: 14mm; right: 14mm; border-width: 0 3px 3px 0; }

  /* 배경 별 장식 */
  .stars-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    color: #f5c842;
    font-size: 14px;
    opacity: 0.25;
    animation: twinkle 3s infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.15; } to { opacity: 0.35; } }

  /* 상단 리본 배너 */
  .ribbon-wrap {
    position: relative;
    margin-bottom: 6mm;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ribbon {
    background: linear-gradient(90deg, #c8900a, #f5c842, #c8900a);
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 6px 28px;
    border-radius: 2px;
    box-shadow: 0 2px 8px rgba(200,144,10,0.3);
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .ribbon-deco {
    font-size: 20px;
  }

  /* 메인 타이틀 */
  .event-title {
    font-size: 22px;
    font-weight: 700;
    color: #5a3e00;
    letter-spacing: 4px;
    margin-bottom: 2mm;
    text-align: center;
  }

  /* 상 종류 */
  .award-type-wrap {
    margin: 5mm 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    position: relative;
  }
  .award-type-wrap::before, .award-type-wrap::after {
    content: '';
    display: block;
    width: 60mm;
    height: 2px;
    background: linear-gradient(90deg, transparent, #c8900a, transparent);
    margin: 3px 0;
  }
  .award-label {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    color: #888;
    letter-spacing: 2px;
  }
  .award-type {
    font-size: 52px;
    font-weight: 900;
    color: #c8900a;
    letter-spacing: 10px;
    line-height: 1.1;
    text-shadow: 2px 3px 8px rgba(200,144,10,0.25);
  }

  /* 수상자 섹션 */
  .recipient-section {
    margin: 4mm 0;
    text-align: center;
  }
  .category-badge {
    display: inline-block;
    background: linear-gradient(90deg, #f9f0d8, #f5e3a0, #f9f0d8);
    border: 1.5px solid #e8b84b;
    border-radius: 20px;
    padding: 4px 20px;
    font-size: 13px;
    font-weight: 600;
    color: #8a6200;
    letter-spacing: 2px;
    margin-bottom: 4mm;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .recipient-name-wrap {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
  }
  .recipient-name {
    font-size: 54px;
    font-weight: 900;
    color: #2c1800;
    letter-spacing: 12px;
    text-shadow: 1px 2px 6px rgba(0,0,0,0.1);
  }
  .recipient-suffix {
    font-size: 24px;
    font-weight: 600;
    color: #5a3e00;
    letter-spacing: 2px;
  }

  /* 본문 */
  .body-text {
    margin: 5mm 0;
    text-align: center;
    line-height: 2.2;
    font-size: 15.5px;
    color: #3a2800;
    font-weight: 500;
    letter-spacing: 1px;
  }
  .body-text strong {
    color: #c8900a;
    font-weight: 700;
  }

  /* 트로피 아이콘 */
  .trophy-icon {
    font-size: 52px;
    margin: 2mm 0;
    filter: drop-shadow(0 3px 8px rgba(200,144,10,0.4));
    line-height: 1;
  }

  /* 날짜 */
  .date-section {
    margin: 6mm 0 3mm;
    font-size: 15px;
    color: #5a3e00;
    letter-spacing: 3px;
    font-weight: 600;
    border-top: 1px dashed #e8b84b;
    padding-top: 4mm;
    width: 100%;
    text-align: center;
  }

  /* 수여자 */
  .issuer-section {
    margin-top: 2mm;
    text-align: center;
  }
  .issuer-section p {
    font-size: 16px;
    font-weight: 700;
    color: #3a2800;
    letter-spacing: 3px;
    line-height: 2;
  }
  .seal {
    display: inline-block;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 3px solid #c8900a;
    line-height: 42px;
    font-size: 12px;
    font-weight: 700;
    color: #c8900a;
    letter-spacing: 0;
    margin-left: 10px;
    vertical-align: middle;
    box-shadow: 0 0 0 1px #e8b84b inset;
  }

  /* 하단 풀꽃 장식 */
  .flowers-bottom {
    position: absolute;
    bottom: 14mm;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 16mm;
    font-size: 20px;
    opacity: 0.55;
    pointer-events: none;
  }

  @media print {
    body { background: #fff; }
    .certificate { box-shadow: none; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>
<div class="certificate">

  <!-- 테두리 -->
  <div class="border-outer"></div>
  <div class="border-inner"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- 배경 별들 -->
  <div class="stars-bg">
    <span class="star" style="top:8%;left:7%">★</span>
    <span class="star" style="top:12%;left:85%;animation-delay:.5s">✦</span>
    <span class="star" style="top:22%;left:15%;animation-delay:1s">✶</span>
    <span class="star" style="top:18%;left:75%;animation-delay:.8s">★</span>
    <span class="star" style="top:75%;left:8%;animation-delay:1.2s">✦</span>
    <span class="star" style="top:80%;left:88%;animation-delay:.3s">✶</span>
    <span class="star" style="top:88%;left:20%;animation-delay:.7s">★</span>
    <span class="star" style="top:85%;left:72%;animation-delay:1.5s">✦</span>
    <span class="star" style="top:45%;left:4%;animation-delay:.9s">✶</span>
    <span class="star" style="top:48%;left:93%;animation-delay:.4s">★</span>
  </div>

  <!-- 리본 -->
  <div class="ribbon-wrap">
    <span class="ribbon-deco">🌟</span>
    <div class="ribbon">신길 7동 어린이 그림그리기 대회</div>
    <span class="ribbon-deco">🌟</span>
  </div>

  <!-- 트로피 -->
  <div class="trophy-icon">🏆</div>

  <!-- 상 종류 -->
  <div class="award-type-wrap">
    <span class="award-label">수 상 종 류</span>
    <div class="award-type">참 가 상</div>
  </div>

  <!-- 수상자 -->
  <div class="recipient-section">
    <div class="category-badge">유 아 부</div>
    <div class="recipient-name-wrap">
      <span class="recipient-name">홍 지 안</span>
      <span class="recipient-suffix">어린이</span>
    </div>
  </div>

  <!-- 본문 -->
  <div class="body-text">
    위 어린이는 <strong>신길 7동 어린이 그림그리기 대회</strong>에<br>
    열정과 창의력으로 적극 참가하였기에<br>
    이 상장을 드립니다.
  </div>

  <!-- 날짜 -->
  <div class="date-section">
    2026년 &nbsp; 7월 &nbsp; 11일
  </div>

  <!-- 수여자 -->
  <div class="issuer-section">
    <p>보라매 SK뷰 아빠, 엄마 <span class="seal">직인</span></p>
  </div>

  <!-- 하단 꽃 장식 -->
  <div class="flowers-bottom">
    <span>🌸🌼🌺</span>
    <span>🌺🌼🌸</span>
  </div>

</div>
</body>
</html>
